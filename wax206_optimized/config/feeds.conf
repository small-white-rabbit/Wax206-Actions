# ============================================================================
# WAX206 Feeds 源配置文件
# ============================================================================
# 格式：每行一个 feed，格式为：名称 URL;分支
# ============================================================================
# 注意：
# - 以 # 开头的行为注释
# - 以 ! 开头的行表示该源有问题，需要特殊处理（手动克隆）
# ============================================================================

# ==================== 官方 feeds（通过 feeds update 正常更新） ====================
# 官方 feeds 在 feeds.conf.default 中已定义，此处无需重复

# ==================== 第三方 feeds（正常更新） ====================
passwall https://github.com/Openwrt-Passwall/openwrt-passwall;main
openclash https://github.com/vernesong/OpenClash.git;master

# ==================== 第三方 feeds（特殊处理，手动克隆） ====================
# 这些源中部分包的 Makefile 格式有问题，需要手动克隆后选择性复制
!kenzok https://github.com/kenzok8/openwrt-packages.git;master
!openwrt_bandix https://github.com/timsaya/openwrt-bandix.git;main
!luci_app_bandix https://github.com/timsaya/luci-app-bandix.git;main

# ==================== 需要从 kenzok 源安装的包 ====================
# 格式：kenzok:包名
KENZOK_PACKAGES=luci-theme-argon luci-app-argon-config

# ==================== 需要从 bandix 源安装的包 ====================
BANDIX_PACKAGES=openwrt-bandix
LUCI_BANDIX_PACKAGES=luci-app-bandix