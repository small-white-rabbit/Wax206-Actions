# ============================================================================
# WAX206 编译配置文件 - 集中管理所有可配置项
# ============================================================================
# 使用方法：在脚本中 source 此文件，然后使用 $CONFIG_XXX 变量
# ============================================================================

# ==================== 网络配置 ====================
LAN_IP=192.168.31.1
HOSTNAME=Wax206
TIMEZONE=Asia/Shanghai

# ==================== WiFi 配置 ====================
SSID=Wax206
WIFI_COUNTRY=US
WIFI_POWER=28
WIFI_ENABLED=1

# ==================== Conntrack 配置 ====================
CONNTRACK_MAX=262144
CONNTRACK_TCP_TIMEOUT_ESTABLISHED=600
CONNTRACK_TCP_TIMEOUT_TIME_WAIT=30
CONNTRACK_TCP_TIMEOUT_CLOSE_WAIT=10
CONNTRACK_TCP_TIMEOUT_FIN_WAIT=10

# ==================== 编译配置 ====================
# 并行编译数（相对于 CPU 核数）
PARALLEL_FACTOR=2
# 下载并行数
DOWNLOAD_PARALLEL_FACTOR=4

# ==================== Golang 配置 ====================
GOLANG_REPO=https://github.com/sbwml/packages_lang_golang
GOLANG_BRANCH=26.x

# ==================== 版本信息 ====================
# OpenWrt 源码仓库（在 compilecfg/*.ini 中配置）
# 此处仅作为备用默认值
DEFAULT_REPO_URL=https://github.com/openwrt/openwrt.git
DEFAULT_REPO_BRANCH=main