name: GPTRelease_wax206_选择编译
run-name: Release - ${{ inputs.model || 'wax206'}}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: gwax206
        options:
          - wax206
          - fmwax206
          - gwax206
          - gwax206_imm

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DIY_my_SH: diy-part2.sh

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 可用磁盘空间
        uses: sbwml/actions@free-disk
        with:
          build-mount-path: ${{ github.workspace }}

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 修复脚本执行权限
        run: |
          chmod +x wrt_core/pre_clone_action.sh
          chmod +x wrt_core/update.sh
          chmod +x sh/build.sh
          chmod +x diy-part2.sh
          find wrt_core/packages -name "*.sh" -exec chmod +x {} +

      # ================== 优化点：缓存 apt 依赖 ==================
      - name: 缓存 apt 依赖
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('**/apt-dependencies.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: 安装必要依赖
        run: |
          sudo apt update
          if [ -f "apt-dependencies.txt" ]; then
            xargs -a apt-dependencies.txt sudo apt install -y
          else
            echo "警告: apt-dependencies.txt 不存在，跳过安装"
          fi

      # ================== 步骤1: 克隆固件代码 ==================
      - name: 克隆固件代码
        run: ./wrt_core/pre_clone_action.sh ${{ inputs.model || 'wax206'}}

      # ================== 步骤2: 初始化构建环境（在克隆后执行）====================
      - name: 初始化构建环境
        run: |
          if [ ! -d "./action_build/staging_dir" ]; then
            echo "首次构建，初始化工具链和 SDK..."
            curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh -o /tmp/init_build.sh
            sudo bash /tmp/init_build.sh
          else
            echo "构建环境已缓存，跳过初始化"
          fi

      - name: 设置构建日期和时区
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          echo "BUILD_DATE=$(date +"%y.%m.%d_%H.%M.%S")" >> $GITHUB_ENV
          CONF_FILE="./wrt_core/compilecfg/${{ inputs.model || 'wax206' }}.ini"
          if [ -f "$CONF_FILE" ]; then
            SRC_URL=$(grep "REPO_URL" "$CONF_FILE" | cut -d'=' -f2-)
            echo "BUILD_SRC=$SRC_URL" >> $GITHUB_ENV
          else
            echo "BUILD_SRC=Unknown" >> $GITHUB_ENV
            echo "::warning::配置文件 $CONF_FILE 不存在"
          fi

      # ================== 步骤3: 同步 feeds ==================
      - name: 同步 feeds 避免依赖缺失
        run: |
          cd action_build
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd ..

      # ================== 步骤4: 缓存 OpenWrt 构建结果 ==================
      - name: 缓存构建依赖
        uses: actions/cache@v4
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-build-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}
          restore-keys: |
            ${{ matrix.os }}-build-${{ inputs.model }}-

      - name: 刷新缓存时间戳
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      # ================== 步骤5: 构建固件 ==================
      - name: 构建固件（并行编译）
        run: |
          chmod +x $DIY_my_SH
          ./sh/build.sh ${{ inputs.model || 'wax206'}} -j$(nproc)

      # ================== 步骤6: 获取版本信息 ==================
      - name: 获取内核版本和提交信息
        run: |
          # 获取内核版本（带错误处理）
          if [ -d "./action_build/dl" ]; then
            KVER=$(find ./action_build/dl -maxdepth 1 -name "linux-[4-6].*" 2>/dev/null | sort -r | head -n 1 | grep -oE "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}")
            echo "KVER=${KVER:-unknown}" >> $GITHUB_ENV
          else
            echo "KVER=unknown" >> $GITHUB_ENV
          fi
          
          # 获取源码提交信息
          cd action_build
          if git rev-parse --git-dir > /dev/null 2>&1; then
            useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H")
            echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
          else
            echo "useVersionInfo=Git info not available" >> $GITHUB_ENV
          fi
          cd ..

      # ================== 步骤7: 上传固件到 Artifacts ==================
      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ inputs.model }}-${{ env.BUILD_DATE }}
          path: |
            firmware/
            !firmware/*.manifest
          retention-days: 7

      # ================== 步骤8: 创建 GitHub Release（可选）====================
      - name: 创建 GitHub Release
        if: github.event_name == 'workflow_dispatch' && success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.model }}-${{ env.BUILD_DATE }}
          name: ${{ inputs.model }} 固件 ${{ env.BUILD_DATE }}
          body: |
            ## 固件信息
            - **设备型号**: ${{ inputs.model }}
            - **构建时间**: ${{ env.BUILD_DATE }}
            - **内核版本**: ${{ env.KVER }}
            - **源码地址**: ${{ env.BUILD_SRC }}
            
            ## 提交信息
            ${{ env.useVersionInfo }}
          files: |
            firmware/*.bin
            firmware/*.itb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ================== 步骤9: 清理工作 ==================
      - name: 构建后清理
        if: always()
        run: |
          echo "构建完成，清理临时文件..."
          df -h
