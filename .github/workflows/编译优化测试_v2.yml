name: 编译优化测试 V2
run-name: 优化V2 - ${{ inputs.model || 'gwax206' }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: gwax206
        options:
          - wax206      # 原版 32M
          - fmwax206    # 扩容 70M
          - gwax206     # 扩容 256M
          - gwax206_imm # 扩容 256M ImmortalWrt

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # 强制使用 Node.js 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 可用磁盘空间
        uses: sbwml/actions@free-disk
        with:
          build-mount-path: ${{ github.workspace }}

      - name: 构建系统设置
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix libfuse-dev ccache
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，确保最新代码

      - name: 确认脚本版本
        run: |
          echo "=== 检查 build.sh 版本 ==="
          head -20 wax206_optimized/build.sh
          grep -n "remove_attendedsysupgrade" wax206_optimized/build.sh | head -5
          grep -A5 "remove_attendedsysupgrade()" wax206_optimized/build.sh | head -10

      - name: 修复脚本执行权限
        run: chmod +x wax206_optimized/build.sh

      - name: 设置构建日期和时区
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

          CONF_FILE="./wax206_optimized/compilecfg/${{ inputs.model || 'gwax206' }}.ini"

          if [ -f "$CONF_FILE" ]; then
            SRC_URL=$(grep "REPO_URL" "$CONF_FILE" | cut -d'=' -f2-)
            echo "BUILD_SRC=$SRC_URL" >> $GITHUB_ENV
          else
            echo "BUILD_SRC=https://github.com/openwrt/openwrt.git" >> $GITHUB_ENV
            echo "::warning::配置文件 $CONF_FILE 不存在，使用默认值"
          fi

      # ===== 缓存依赖 =====
      - name: 缓存依赖
        uses: actions/cache@v5.0.2
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
            ./action_build/feeds
          key: ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-

      # ===== 刷新缓存 =====
      - name: 刷新缓存
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            echo "刷新 staging_dir 中的 stamp 文件时间戳..."
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
              find "$dir" -type f -exec touch {} +
            done
            echo "stamp 文件时间戳刷新完成"
          else
            echo "staging_dir 目录不存在，跳过缓存刷新"
          fi

      - name: 构建固件
        run: ./wax206_optimized/build.sh ${{ inputs.model || 'gwax206' }}

      - name: 获取内核版本
        run: |
          KVER="Unknown"
          
          MANIFEST_FILE=$(find ./firmware -name "*.manifest" -type f 2>/dev/null | head -1)
          if [ -n "$MANIFEST_FILE" ]; then
            KVER=$(grep "^kernel - " "$MANIFEST_FILE" 2>/dev/null | head -1 | sed -E 's/kernel - ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
          fi
          
          [ -z "$KVER" ] && KVER="Unknown"
          echo "KVER=$KVER" >> $GITHUB_ENV
          
          if [ -d "action_build" ]; then
            cd action_build
            useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H" 2>/dev/null || echo "Author: unknown<br/>date: unknown<br/>commit: unknown<br/>commit hash: unknown")
            echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
            cd ..
          else
            echo "useVersionInfo=Author: unknown<br/>date: unknown<br/>commit: unknown<br/>commit hash: unknown" >> $GITHUB_ENV
          fi
        continue-on-error: true

      - name: 删除旧缓存
        run: |
          gh cache list --key ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          echo "========cache status========"
          echo "ccache: $(du -sh ./action_build/.ccache 2>/dev/null | cut -f 1 || echo 'N/A')"
          echo "staging: $(du -sh ./action_build/staging_dir 2>/dev/null | cut -f 1 || echo 'N/A')"
          echo "feeds: $(du -sh ./action_build/feeds 2>/dev/null | cut -f 1 || echo 'N/A')"

      - name: 输出虚拟机信息
        run: |
          echo "=============================================="
          lscpu | grep -E "name|Core|Thread"
          echo "=============================================="
          df -h
          echo "=============================================="

      - name: 准备发布简介
        run: |
          echo "编译优化测试 V2（应用全部优化）" > release_body.txt
          echo "型号: ${{ inputs.model || 'gwax206' }}" >> release_body.txt
          echo "源码：${{ env.BUILD_SRC }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "SSID: Wax206" >> release_body.txt
          echo "LAN地址: 192.168.31.1" >> release_body.txt
          echo "源码最近提交信息:" >> release_body.txt
          echo "${{ env.useVersionInfo }}" >> release_body.txt
          echo "优化项：配置集中管理、feeds并行更新、feeds缓存、下载并行数增加" >> release_body.txt

      - name: 删除不需要的固件文件
        run: |
          rm -f ./firmware/mt7622-ram-1ddr-bl2.bin
          rm -f ./firmware/mt7622-ram-2ddr-bl2.bin

      - name: 发布固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ inputs.model || 'gwax206' }}_opt_v2
          files: ./firmware/*.*
          body_path: ./release_body.txt

      - name: 删除旧的工作流
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: 编译优化测试 V2
          retain_days: 20
          keep_minimum_runs: 5