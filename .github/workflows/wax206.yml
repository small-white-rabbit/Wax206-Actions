name: Build WAX206 Firmware

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'WAX206 Variant'
        required: true
        default: 'gwax206'
        type: choice
        options:
          - wax206
          - fmwax206
          - gwax206
          - gwax206_imm
  push:
    branches:
      - main
  schedule:
    - cron: 0 20 * * 5

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  FEEDS_CONF: test/Openwrt/feeds.conf.default
  CONFIG_FILE: test/config/wax206.config
  DIY_P1_SH: test/Openwrt/diy-part1.sh
  DIY_P2_SH: test/Openwrt/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://raw.githubusercontent.com/moruiris/Actions-OpenWrt/main/Openwrt/depends-ubuntu-2404)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone Source Code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load Custom Feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update Feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install Feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download Packages
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check Space Usage
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize Files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware Directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # ===== 获取内核版本和源码信息 =====
    - name: Get Kernel Version and Source Info
      id: info
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        cd openwrt
        # 获取内核版本
        KVER="unknown"
        # 从 manifest 文件读取内核版本
        # manifest 文件格式: kernel - 6.18.33~12916f99c2c7a3cc8b861be165060899-r1
        MANIFEST_FILE=$(find ../firmware -name "*.manifest" -type f 2>/dev/null | head -1)
        if [ -n "$MANIFEST_FILE" ]; then
          KVER=$(grep "^kernel - " "$MANIFEST_FILE" 2>/dev/null | head -1 | sed -E 's/kernel - ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
        fi
        echo "KVER=${KVER:-unknown}" >> $GITHUB_ENV
        # 获取源码信息
        useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H")
        echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
        # 获取源码URL
        echo "BUILD_SRC=$REPO_URL" >> $GITHUB_ENV
        # 设置构建日期
        echo "BUILD_DATE=$(date +"%y.%m.%d_%H.%M.%S")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # ===== 删除不需要的固件文件 =====
    - name: Clean Unnecessary Files
      if: steps.info.outputs.status == 'success' && !cancelled()
      run: |
        cd ${{ env.FIRMWARE }}
        rm -f mt7622-ram-1ddr-bl2.bin
        rm -f mt7622-ram-2ddr-bl2.bin
        echo "已删除不需要的 bl2.bin 文件"

    # ===== 准备发布简介 =====
    - name: Prepare Release Notes
      id: release_notes
      if: steps.info.outputs.status == 'success' && !cancelled()
      run: |
        MODEL="${{ github.event.inputs.model || 'gwax206' }}"
        echo "云编译发布" > release_body.txt
        echo "型号: $MODEL" >> release_body.txt
        echo "源码: ${{ env.BUILD_SRC }}" >> release_body.txt
        echo "Kernel: ${{ env.KVER }}" >> release_body.txt
        echo "SSID: Wax206" >> release_body.txt
        echo "LAN地址: 192.168.31.1" >> release_body.txt
        echo "" >> release_body.txt
        echo "源码最近提交信息:" >> release_body.txt
        echo "${{ env.useVersionInfo }}" >> release_body.txt
        echo "" >> release_body.txt
        echo "插件列表:" >> release_body.txt
        # 从 manifest 文件提取插件列表
        MANIFEST=$(ls ${{ env.FIRMWARE }}/*.manifest 2>/dev/null | head -1)
        if [ -f "$MANIFEST" ]; then
          grep -oE "luci-app-[a-zA-Z0-9_-]+" "$MANIFEST" | sort -u | xargs -d '\n' -n5 printf "%-25s  %-25s  %-25s  %-25s  %-25s\n" >> release_body.txt
        else
          echo "(manifest 文件不存在)" >> release_body.txt
        fi
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to Release
      uses: softprops/action-gh-release@v2
      if: steps.release_notes.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.BUILD_DATE }}_${{ github.event.inputs.model || 'gwax206' }}
        body_path: release_body.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete Old Workflow Runs
      uses: Mattraks/delete-workflow-runs@main
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        delete_workflow_pattern: Build WAX206 Firmware
        retain_days: 20
        keep_minimum_runs: 5

    - name: Delete Old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 10
        delete_tag_pattern: wax206
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
