name: Release_wax206_auto
run-name: Release - ${{ inputs.model || 'wax206'}}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: wax206
        options:
          - wax206      # 原版 128M
          - fmwax206    # 扩容 70M
          - gwax206     # 扩容 256M

  schedule:
    - cron: 43 3 * * 4

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DIY_my_SH: sh/ax6_imm_diy-part2.sh

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 可用磁盘空间
        uses: sbwml/actions@free-disk
        with:
          build-mount-path: ${{ github.workspace }}

      - name: 构建系统设置
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: 检出
        uses: actions/checkout@v4

      - name: 设置构建日期和时区
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          export BUILD_SRC=$(awk -F"=" '/REPO_URL/ {print $NF}' "./compilecfg/wax206.ini")
          echo "BUILD_SRC=$BUILD_SRC" >> $GITHUB_ENV

      - name: 克隆固件代码
        run: ./wrt_core/pre_clone_action.sh wax206

      # ===== 关键：自动应用扩容方案（无patch，直接修改） =====
      - name: 应用扩容方案
        if: inputs.model == 'fmwax206' || inputs.model == 'gwax206'
        run: |
          cd action_build
          
          case "${{ inputs.model }}" in
            fmwax206)
              echo "=== 应用 70M 扩容方案 ==="
              # 1. 替换 DTS
              cp $GITHUB_WORKSPACE/dts/wax206-70m.dts \
                 target/linux/mediatek/dts/mt7622-netgear-wax206.dts
              
              # 2. 直接替换 mt7622.mk
              cp $GITHUB_WORKSPACE/mediatek/image/mt7622-70m.mk \
                 target/linux/mediatek/image/mt7622.mk
              
              echo "VARIANT=70m" >> $GITHUB_ENV
              ;;
              
            gwax206)
              echo "=== 应用 256M 扩容方案 ==="
              cp $GITHUB_WORKSPACE/dts/wax206-256m.dts \
                 target/linux/mediatek/dts/mt7622-netgear-wax206.dts
              
              cp $GITHUB_WORKSPACE/mediatek/image/mt7622-256m.mk \
                 target/linux/mediatek/image/mt7622.mk
              
              echo "VARIANT=256m" >> $GITHUB_ENV
              ;;
          esac
          
          echo "=== 验证修改 ==="
          grep -E "(IMAGE_SIZE|KERNEL_SIZE)" target/linux/mediatek/image/mt7622.mk | grep -A1 -B1 "wax206" || true
          grep "factory.img" target/linux/mediatek/image/mt7622.mk | head -3

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-

      - name: 刷新缓存
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: 构建固件
        run: |
          chmod +x $DIY_my_SH
          ./sh/build.sh wax206

      - name: 获取内核版本
        run: |
          echo "KVER=$(find ./action_build/dl -maxdepth 1 -name "linux-[4-6]\.*" | sort -r | head -n 1 | grep -oE "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}")" >> $GITHUB_ENV
          cd action_build
          useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H")
          echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
          cd ..
          
      - name: 删除旧缓存
        run: |
          gh cache list --key ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          echo "========cache status========"
          echo "ccache: $(du -sh ./action_build/.ccache | cut -f 1)"
          echo "staging: $(du -sh ./action_build/staging_dir | cut -f 1)"

      - name: 输出虚拟机信息
        run: |
          echo "=============================================="
          lscpu | grep -E "name|Core|Thread"
          echo "=============================================="
          df -h
          echo "=============================================="

      # ===== 精确版本重命名固件 =====
      - name: 重命名固件（区分版本）
        run: |
          cd firmware
          VARIANT="${{ env.VARIANT }}"
          
          case "$VARIANT" in
            70m)
              for f in *netgear_wax206*; do
                [ -f "$f" ] && mv "$f" "${f/netgear_wax206/netgear_wax206-70m}"
              done
              echo "已重命名为 70m 版本"
              ;;
            256m)
              for f in *netgear_wax206*; do
                [ -f "$f" ] && mv "$f" "${f/netgear_wax206/netgear_wax206-256m}"
              done
              echo "已重命名为 256m 版本"
              ;;
            *)
              echo "原版固件，保持默认名称"
              ;;
          esac
          
          echo "=== 最终固件列表 ==="
          ls -la *wax206* 2>/dev/null || true

      - name: 准备发布简介
        run: |
          VARIANT="${{ env.VARIANT }}"
          echo "云编译发布" > release_body.txt
          echo "型号: ${{ inputs.model || 'wax206' }}${VARIANT:+ ($VARIANT)}" >> release_body.txt
          echo "源码：${{ env.BUILD_SRC }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "WIFI密码: " >> release_body.txt
          echo "LAN地址: 192.168.31.1" >> release_body.txt
          echo "源码最近提交信息:" >> release_body.txt
          echo "${{ env.useVersionInfo }}" >> release_body.txt
          echo "插件：" >> release_body.txt
          echo "$(grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" ./firmware/*.manifest 2>/dev/null | awk -F":" '{print $NF}' | xargs -d '\n' -n5 printf "%-25s  %-25s  %-25s  %-25s  %-25s\n")" >> release_body.txt

      - name: 删除不需要的固件文件
        run: |
          rm -f ./firmware/mt7622-ram-1ddr-bl2.bin
          rm -f ./firmware/mt7622-ram-2ddr-bl2.bin
          rm -f ./firmware/openwrt-mediatek-mt7622-netgear_wax206-initramfs-recovery.itb
          rm -f ./firmware/*-recovery.itb 2>/dev/null || true

      - name: 发布固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ inputs.model || 'wax206'}}
          files: ./firmware/*.*
          body_path: ./release_body.txt

      - name: 删除旧的工作流和固件
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: Release_wax206_auto
          retain_days: 20
          keep_minimum_runs: 5
    
      - name: 删除旧的发布版本
        uses: codesnas/delete-older-releases@main
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 10
          delete_tag_pattern: ${{ inputs.model || 'wax206'}}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
