name: Release_wax206_matrix
run-name: Release - All Variants

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: 编译所有版本
        type: boolean
        default: true

  schedule:
    - cron: 43 3 * * 4

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DIY_my_SH: sh/ax6_imm_diy-part2.sh

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stock
            mk_file: ""           # 原版不替换
            dts: ""
            suffix: ""
          - variant: 70m
            mk_file: "mt7622-70m.mk"   # 70M 版本 mk 文件
            dts: "wax206-70m.dts"
            suffix: "-70m"
          - variant: 256m
            mk_file: "mt7622-256m.mk"  # 256M 版本 mk 文件
            dts: "wax206-256m.dts"
            suffix: "-256m"

    runs-on: ubuntu-24.04

    steps:
      - name: 可用磁盘空间
        uses: sbwml/actions@free-disk
        with:
          build-mount-path: ${{ github.workspace }}

      - name: 构建系统设置
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: 检出
        uses: actions/checkout@v4

      - name: 设置构建日期和时区
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          export BUILD_SRC=$(awk -F"=" '/REPO_URL/ {print $NF}' "./compilecfg/wax206.ini")
          echo "BUILD_SRC=$BUILD_SRC" >> $GITHUB_ENV

      - name: 克隆固件代码
        run: ./wrt_core/pre_clone_action.sh wax206

      # ===== 关键：应用扩容方案（直接替换 mk 文件） =====
      - name: 应用扩容方案
        if: matrix.variant != 'stock'
        run: |
          cd action_build
          
          echo "=== 构建 ${{ matrix.variant }} 版本 ==="
          
          # 1. 替换 DTS（直接覆盖原文件）
          cp $GITHUB_WORKSPACE/dts/${{ matrix.dts }} \
             target/linux/mediatek/dts/mt7622-netgear-wax206.dts
          echo "已复制 DTS: ${{ matrix.dts }} → mt7622-netgear-wax206.dts"
          
          # 2. 直接替换 mt7622.mk 文件
          cp $GITHUB_WORKSPACE/mediatek/image/${{ matrix.mk_file }} \
             target/linux/mediatek/image/mt7622.mk
          echo "已替换 mt7622.mk: ${{ matrix.mk_file }}"
          
          # 验证修改
          echo "=== 验证 mt7622.mk 修改 ==="
          grep -E "(IMAGE_SIZE|KERNEL_SIZE)" target/linux/mediatek/image/mt7622.mk | grep -A1 -B1 "wax206" || true
          grep "factory.img" target/linux/mediatek/image/mt7622.mk | head -2

      - name: 配置默认设置
        run: |
          cd action_build
          
          echo "=== 配置默认IP、WiFi和中文 ==="
          
          sed -i 's/192.168.1.1/192.168.31.1/g' package/base-files/files/bin/config_generate
          
          mkdir -p feeds/luci/modules/luci-base/root/etc/config
          cat > feeds/luci/modules/luci-base/root/etc/config/luci << 'EOF'
          config core 'main'
              option lang 'zh_cn'
              option mediaurlbase '/luci-static/bootstrap'
              option resourcebase '/luci-static/resources'
          
          config internal 'languages'
              option zh_cn '中文 (Chinese)'
              option en 'English'
          EOF
          
          mkdir -p package/base-files/files/etc/config
          cat > package/base-files/files/etc/config/wireless << 'EOF'
          config wifi-device 'radio0'
              option type 'mac80211'
              option path 'platform/18000000.wmac'
              option channel 'auto'
              option band '2g'
              option htmode 'HE40'
              option country 'CN'
              option disabled '0'
          
          config wifi-iface 'default_radio0'
              option device 'radio0'
              option network 'lan'
              option mode 'ap'
              option ssid 'WAX206'
              option encryption 'none'
          
          config wifi-device 'radio1'
              option type 'mac80211'
              option path '1a143000.pcie/pci0000:00/0000:00:00.0/0000:01:00.0'
              option channel 'auto'
              option band '5g'
              option htmode 'HE80'
              option country 'CN'
              option disabled '0'
          
          config wifi-iface 'default_radio1'
              option device 'radio1'
              option network 'lan'
              option mode 'ap'
              option ssid 'WAX206_5G'
              option encryption 'none'
          EOF
          
          echo "默认IP: 192.168.31.1"
          echo "默认WiFi: WAX206 / WAX206_5G（无密码）"
          echo "默认语言: 中文"

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ubuntu-24.04-${{ hashFiles('**/repo_flag') }}-${{ matrix.variant }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ubuntu-24.04-${{ hashFiles('**/repo_flag') }}-${{ matrix.variant }}-
            ubuntu-24.04-${{ hashFiles('**/repo_flag') }}-

      - name: 刷新缓存
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: 构建固件
        run: |
          chmod +x $DIY_my_SH
          ./sh/build.sh wax206

      - name: 获取内核版本
        run: |
          echo "KVER=$(find ./action_build/dl -maxdepth 1 -name "linux-[4-6]\.*" | sort -r | head -n 1 | grep -oE "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}")" >> $GITHUB_ENV
          cd action_build
          useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H")
          echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
          cd ..

      - name: 重命名固件
        run: |
          cd firmware
          SUFFIX="${{ matrix.suffix }}"
          
          case "$SUFFIX" in
            -70m)
              for f in *netgear_wax206*; do
                [ -f "$f" ] && mv "$f" "${f/netgear_wax206/netgear_wax206-70m}"
              done
              echo "已重命名为 70m 版本"
              ;;
            -256m)
              for f in *netgear_wax206*; do
                [ -f "$f" ] && mv "$f" "${f/netgear_wax206/netgear_wax206-256m}"
              done
              echo "已重命名为 256m 版本"
              ;;
            *)
              echo "原版固件，保持默认名称"
              ;;
          esac
          
          ls -la *wax206* 2>/dev/null || true

      - name: 上传固件到Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wax206-${{ matrix.variant }}-${{ env.BUILD_DATE }}
          path: ./firmware/*.*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: 下载所有Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-firmwares
          pattern: wax206-*

      - name: 设置日期
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")" >> $GITHUB_ENV

      - name: 准备发布简介
        run: |
          echo "云编译发布 - WAX206 全版本" > release_body.txt
          echo "" >> release_body.txt
          echo "### 默认配置" >> release_body.txt
          echo "- **管理IP**: 192.168.31.1" >> release_body.txt
          echo "- **WiFi名称**: WAX206 / WAX206_5G" >> release_body.txt
          echo "- **WiFi密码**: 无（开放网络）" >> release_body.txt
          echo "- **默认语言**: 中文" >> release_body.txt
          echo "" >> release_body.txt
          echo "### 包含版本" >> release_body.txt
          echo "- **stock**: 官方原版（32M闪存）" >> release_body.txt
          echo "- **70m**: 扩容70M闪存" >> release_body.txt
          echo "- **256m**: 扩容256M闪存" >> release_body.txt
          echo "" >> release_body.txt
          echo "⚠️ **刷机警告**: 请根据您的硬件改装版本选择对应固件！" >> release_body.txt
          echo "" >> release_body.txt
          echo "构建时间: ${{ env.BUILD_DATE }}" >> release_body.txt

      - name: 发布合并的固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}_wax206_all
          files: all-firmwares/**/*.*
          body_path: ./release_body.txt

      - name: 删除旧版本
        uses: codesnas/delete-older-releases@main
        with:
          keep_latest: 5
          delete_tag_pattern: wax206_all
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
