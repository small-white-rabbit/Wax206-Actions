name: Release_wax206_matrix
run-name: Release - All Variants

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: 编译所有版本
        type: boolean
        default: true

  schedule:
    - cron: 43 3 * * 4

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DIY_my_SH: diy-part2.sh  # ← 修改：与 auto 版本保持一致

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stock
            mk_file: ""           
            dts: ""
            suffix: ""
          - variant: 70m
            mk_file: "mt7622-70m.mk"   
            dts: "wax206-70m.dts"
            suffix: "-70m"
          - variant: 256m
            mk_file: "mt7622-256m.mk"  
            dts: "wax206-256m.dts"
            suffix: "-256m"

    runs-on: ubuntu-24.04

    steps:
      - name: 可用磁盘空间
        uses: sbwml/actions@free-disk
        with:
          build-mount-path: ${{ github.workspace }}

      - name: 构建系统设置
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: 检出
        uses: actions/checkout@v4

      - name: 设置构建日期和时区
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          export BUILD_SRC=$(awk -F"=" '/REPO_URL/ {print $NF}' "./compilecfg/wax206.ini")
          echo "BUILD_SRC=$BUILD_SRC" >> $GITHUB_ENV
          # ← 新增：设置 VARIANT 环境变量供后续步骤使用
          echo "VARIANT=${{ matrix.variant }}" >> $GITHUB_ENV

      - name: 克隆固件代码
        run: ./wrt_core/pre_clone_action.sh ${{ matrix.variant }}  # ← 修改：传递 variant 而不是固定 wax206

      # ===== 关键：应用扩容方案（直接替换 mk 文件） =====
      - name: 应用扩容方案
        if: matrix.variant != 'stock'
        run: |
          cd action_build
          
          echo "=== 构建 ${{ matrix.variant }} 版本 ==="
          
          # 1. 替换 DTS（直接覆盖原文件）
          cp $GITHUB_WORKSPACE/dts/${{ matrix.dts }} \
             target/linux/mediatek/dts/mt7622-netgear-wax206.dts
          echo "已复制 DTS: ${{ matrix.dts }} → mt7622-netgear-wax206.dts"
          
          # 2. 直接替换 mt7622.mk 文件
          cp $GITHUB_WORKSPACE/mediatek/image/${{ matrix.mk_file }} \
             target/linux/mediatek/image/mt7622.mk
          echo "已替换 mt7622.mk: ${{ matrix.mk_file }}"
          
          # 验证修改
          echo "=== 验证 mt7622.mk 修改 ==="
          grep -E "(IMAGE_SIZE|KERNEL_SIZE)" target/linux/mediatek/image/mt7622.mk | grep -A1 -B1 "wax206" || true
          grep "factory.img" target/linux/mediatek/image/mt7622.mk | head -2

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ubuntu-24.04-${{ hashFiles('**/repo_flag') }}-${{ matrix.variant }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ubuntu-24.04-${{ hashFiles('**/repo_flag') }}-${{ matrix.variant }}-
            ubuntu-24.04-${{ hashFiles('**/repo_flag') }}-

      - name: 刷新缓存
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: 构建固件
        run: |
          chmod +x $DIY_my_SH
          ./sh/build.sh ${{ matrix.variant }}  # ← 修改：传递 variant 参数

      - name: 获取内核版本
        run: |
          echo "KVER=$(find ./action_build/dl -maxdepth 1 -name "linux-[4-6]\.*" | sort -r | head -n 1 | grep -oE "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}")" >> $GITHUB_ENV
          cd action_build
          useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H")
          echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
          cd ..

      # ← 新增：删除旧缓存步骤（从 auto 版本同步）
      - name: 删除旧缓存
        run: |
          gh cache list --key ubuntu-24.04-${{ hashFiles('**/repo_flag') }}-${{ matrix.variant }}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          echo "========cache status========"
          echo "ccache: $(du -sh ./action_build/.ccache | cut -f 1)"
          echo "staging: $(du -sh ./action_build/staging_dir | cut -f 1)"

      # ← 新增：输出虚拟机信息步骤（从 auto 版本同步）
      - name: 输出虚拟机信息
        run: |
          echo "=============================================="
          lscpu | grep -E "name|Core|Thread"
          echo "=============================================="
          df -h
          echo "=============================================="

      # ===== 精确版本重命名固件 =====
      - name: 重命名固件（区分版本）
        run: |
          cd firmware
          VARIANT="${{ matrix.variant }}"  # ← 修改：使用 matrix.variant 而不是 env.VARIANT
          
          case "$VARIANT" in
            70m)
              for f in *netgear_wax206*; do
                [ -f "$f" ] && mv "$f" "${f/netgear_wax206/netgear_wax206-70m}"
              done
              echo "已重命名为 70m 版本"
              ;;
            256m)
              for f in *netgear_wax206*; do
                [ -f "$f" ] && mv "$f" "${f/netgear_wax206/netgear_wax206-256m}"
              done
              echo "已重命名为 256m 版本"
              ;;
            *)
              echo "原版固件，保持默认名称"
              ;;
          esac
          
          echo "=== 最终固件列表 ==="
          ls -la *wax206* 2>/dev/null || true

      # ← 新增：准备发布简介步骤（每个 variant 单独的信息，可选）
      - name: 准备发布简介
        run: |
          VARIANT="${{ matrix.variant }}"
          echo "云编译发布" > release_body.txt
          echo "型号: wax206${VARIANT:+ ($VARIANT)}" >> release_body.txt
          echo "源码：${{ env.BUILD_SRC }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "WIFI密码: " >> release_body.txt
          echo "LAN地址: 192.168.31.1" >> release_body.txt
          echo "源码最近提交信息:" >> release_body.txt
          echo "${{ env.useVersionInfo }}" >> release_body.txt
          echo "插件：" >> release_body.txt
          echo "$(grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" ./firmware/*.manifest 2>/dev/null | awk -F":" '{print $NF}' | xargs -d '\n' -n5 printf "%-25s  %-25s  %-25s  %-25s  %-25s\n")" >> release_body.txt

      # ← 新增：删除不需要的固件文件（从 auto 版本同步）
      - name: 删除不需要的固件文件
        run: |
          rm -f ./firmware/mt7622-ram-1ddr-bl2.bin
          rm -f ./firmware/mt7622-ram-2ddr-bl2.bin
          rm -f ./firmware/openwrt-mediatek-mt7622-netgear_wax206-initramfs-recovery.itb
          rm -f ./firmware/*-recovery.itb 2>/dev/null || true

      - name: 上传固件到Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wax206-${{ matrix.variant }}-${{ env.BUILD_DATE }}
          path: ./firmware/*.*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: 下载所有Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-firmwares
          pattern: wax206-*

      - name: 设置日期
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")" >> $GITHUB_ENV

      - name: 准备发布简介
        run: |
          echo "云编译发布 - WAX206 全版本" > release_body.txt
          echo "" >> release_body.txt
          echo "### 默认配置" >> release_body.txt
          echo "- **管理IP**: 192.168.31.1" >> release_body.txt
          echo "- **WiFi名称**: WAX206 / WAX206_5G" >> release_body.txt
          echo "- **WiFi密码**: 无（开放网络）" >> release_body.txt
          echo "- **默认语言**: 中文" >> release_body.txt
          echo "" >> release_body.txt
          echo "### 包含版本" >> release_body.txt
          echo "- **stock**: 官方原版（32M闪存）" >> release_body.txt
          echo "- **70m**: 扩容70M闪存" >> release_body.txt
          echo "- **256m**: 扩容256M闪存" >> release_body.txt
          echo "" >> release_body.txt
          echo "⚠️ **刷机警告**: 请根据您的硬件改装版本选择对应固件！" >> release_body.txt
          echo "" >> release_body.txt
          echo "构建时间: ${{ env.BUILD_DATE }}" >> release_body.txt

      - name: 发布合并的固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}_wax206_all
          files: all-firmwares/**/*.*
          body_path: ./release_body.txt

      # ← 新增：删除旧的工作流步骤（从 auto 版本同步）
      - name: 删除旧的工作流和固件
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: Release_wax206_matrix  # ← 注意：改为 matrix 版本名称
          retain_days: 20
          keep_minimum_runs: 5
    
      - name: 删除旧的发布版本
        uses: codesnas/delete-older-releases@main
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 10  # ← 修改：与 auto 版本保持一致（原为5）
          delete_tag_pattern: wax206_all
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
