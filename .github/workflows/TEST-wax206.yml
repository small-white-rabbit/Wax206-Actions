name: 先测试编译流程文件是否完整后编译
run-name: Release - ${{ inputs.model || 'wax206'}}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: wax206
        options:
          - wax206
          - fmwax206
          - gwax206

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DIY_my_SH: diy-part2.sh

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 1. 检出本地脚本仓库
        uses: actions/checkout@v4

      - name: 2. 自动化诊断与环境预检
        id: diagnose
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          echo "BUILD_DATE=$(date +"%y.%m.%d_%H.%M.%S")" >> $GITHUB_ENV
          
          echo "==================== 🔍 编译环境自检 ===================="
          DEVICE_MODEL="${{ inputs.model || 'wax206' }}"
          echo "设备型号: $DEVICE_MODEL"
          
          # 检查 .ini 文件并提取源码地址
          INI_PATH="./wrt_core/compilecfg/${DEVICE_MODEL}.ini"
          if [ -f "$INI_PATH" ]; then
            echo "✅ 配置文件: $INI_PATH"
            SRC_URL=$(grep "REPO_URL" "$INI_PATH" | cut -d'=' -f2-)
            echo "   🔗 引用源码: $SRC_URL"
            echo "BUILD_SRC=$SRC_URL" >> $GITHUB_ENV
          else
            echo "❌ 缺失配置文件: $INI_PATH"
            exit 1
          fi

          # 检查必要脚本
          check_file() {
            if [ -f "$1" ]; then echo "✅ $2: $1"; else echo "❌ $2: $1 (缺失)"; exit 1; fi
          }
          check_file "./sh/build.sh" "核心编译脚本"
          check_file "./$DIY_my_SH" "DIY 脚本"
          check_file "./wrt_core/pre_clone_action.sh" "预克隆脚本"

          # 执行克隆
          echo "-------------------- 📥 开始拉取源码 --------------------"
          chmod +x ./wrt_core/pre_clone_action.sh
          ./wrt_core/pre_clone_action.sh $DEVICE_MODEL
          
          if [ -d "./action_build" ]; then
            echo "✅ 源码路径: $(pwd)/action_build"
          else
            echo "❌ 源码下载失败"
            exit 1
          fi
          echo "==================== 🚀 自检通过 ===================="

      - name: 3. 清理磁盘空间
        uses: sbwml/actions@free-disk
        with:
          build-mount-path: ${{ github.workspace }}

      - name: 4. 构建系统环境设置
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: 5. 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-

      - name: 6. 编译固件
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi
          chmod +x $DIY_my_SH
          chmod +x ./sh/build.sh
          ./sh/build.sh ${{ inputs.model || 'wax206'}}

      - name: 7. 获取内核与版本信息
        run: |
          echo "KVER=$(find ./action_build/dl -maxdepth 1 -name "linux-[4-6]\.*" | sort -r | head -n 1 | grep -oE "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}")" >> $GITHUB_ENV
          cd action_build
          useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H")
          echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV

      - name: 8. 重命名固件
        run: |
          cd firmware
          case "${{ env.VARIANT }}" in
            70m)  suffix="-70m" ;;
            256m) suffix="-256m" ;;
            *)    suffix="" ;;
          esac
          if [ -n "$suffix" ]; then
            for f in *netgear_wax206*; do
              [ -f "$f" ] && mv "$f" "${f/netgear_wax206/netgear_wax206$suffix}"
            done
          fi

      - name: 9. 准备发布简介
        run: |
          echo "云编译发布" > release_body.txt
          echo "型号: ${{ inputs.model || 'wax206' }}${{ env.VARIANT && format(' ({0})', env.VARIANT) }}" >> release_body.txt
          echo "源码：${{ env.BUILD_SRC }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "LAN地址: 192.168.31.1" >> release_body.txt
          echo "源码最近提交信息:" >> release_body.txt
          echo "${{ env.useVersionInfo }}" >> release_body.txt
          echo "插件：" >> release_body.txt
          grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" ./firmware/*.manifest 2>/dev/null | awk -F":" '{print $NF}' | xargs -r -d '\n' -n5 printf "%-25s  %-25s  %-25s  %-25s  %-25s\n" >> release_body.txt

      - name: 10. 发布固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ inputs.model || 'wax206'}}
          files: ./firmware/*.*
          body_path: ./release_body.txt

      - name: 11. 清理旧数据
        run: |
          gh cache list --json key --jq '.[] | .key' | xargs -I {} gh cache delete {} || true
