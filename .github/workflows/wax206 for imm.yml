name: Build WAX206 Firmware FOR IMMMORTALWRT

on:
  workflow_dispatch:
    inputs:
      use_custom_config:
        description: '是否启用自定义配置（插件追加）'
        required: false
        type: choice
        options: ['yes', 'no']
        default: 'yes'
      custom_lan_ip:
        description: '自定义后台 IP'
        required: false
        default: '192.168.31.1'
        type: string
      enable_openclash:
        description: '包含 OpenClash'
        required: false
        type: choice
        options: ['yes', 'no']
        default: 'yes'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate timestamp
        id: timestamp
        run: echo "time=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib \
            g++-multilib gettext genisoimage git gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone ImmortalWrt source
        run: |
          # 建议 WAX206 使用 ImmortalWrt 源码，对 MT7622 支持更优
          git clone https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt

      - name: Update and install feeds
        working-directory: ./immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply WAX206 Custom Patches
        if: ${{ inputs.use_custom_config == 'yes' }}
        working-directory: ./immortalwrt
        run: |
          # 修改默认 IP
          sed -i "s/192.168.1.1/${{ inputs.custom_lan_ip }}/g" package/base-files/files/bin/config_generate
          
          # 强制修改分区表大小以适应插件 (针对 WAX206 扩容)
          # 注意：这步取决于你使用的 U-Boot，如果是官方分区布局请谨慎
          sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*$/CONFIG_TARGET_ROOTFS_PARTSIZE=448/g' .config || true

      - name: Generate .config for WAX206
        working-directory: ./immortalwrt
        run: |
          # 注入 WAX206 核心硬件配置
          cat > .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7622=y
          CONFIG_TARGET_mediatek_mt7622_DEVICE_netgear_wax206=y
          
          # 启动关键内核配置 (防止循环重启)
          CONFIG_KERNEL_NVMEM=y
          CONFIG_KERNEL_NVMEM_SYSFS=y
          CONFIG_KERNEL_NVMEM_LAYOUT_FIXED=y
          CONFIG_KERNEL_MTD_SPI_NAND_BMT=y
          CONFIG_KERNEL_NET_RANDOM_ETHADDR=y
          CONFIG_KERNEL_SMP=y
          
          # 硬件加速与性能
          CONFIG_PACKAGE_kmod-mtk-hnat=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_luci-app-cpufreq=y
          CONFIG_PACKAGE_luci-app-statistics=y
          
          # 基础组件
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_LUCI_LANG_zh_Hans=y
          EOF

          # 追加插件逻辑
          if [ "${{ inputs.use_custom_config }}" = "yes" ]; then
            [ "${{ inputs.enable_openclash }}" = "yes" ] && echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          fi

          # 自动补全依赖
          make defconfig

      - name: Download dependencies
        working-directory: ./immortalwrt
        run: make download -j$(nproc)

      - name: Build firmware
        working-directory: ./immortalwrt
        run: make -j$(nproc) V=s || make -j1 V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAX206-ImmortalWrt-${{ steps.timestamp.outputs.time }}
          path: immortalwrt/bin/targets/mediatek/mt7622/*.bin
